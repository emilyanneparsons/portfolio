<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The personal portfolio of Emily Parsons."
    />
    <title>Emily Parsons</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="hero">
      <picture class="hero__scene">
        <source
          media="(max-aspect-ratio: 4 / 5)"
          srcset="assets/homepage-background-mobile.webp"
        />
        <img
          class="hero__background"
          src="assets/homepage-background-desktop-v2.webp"
          alt="A colorful paper-cut illustration of the San Francisco skyline beneath a bright blue sky."
        />
      </picture>
      <div class="hero__title-stage" aria-hidden="true">
        <img
          class="hero__title"
          src="assets/homepage-title-clouds-layer.webp"
          alt=""
        />
      </div>
      <div class="sr-only">
        <h1>Emily Parsons</h1>
      </div>
    </main>
  </body>
</html>
