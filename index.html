<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The personal portfolio of Emily Parsons."
    />
    <title>Emily Parsons</title>
    <link rel="stylesheet" href="styles.css?v=20260822-18" />
  </head>
  <body>
    <div class="scroll-story">
      <main class="hero">
      <picture class="hero__scene">
        <source
          media="(max-aspect-ratio: 4 / 5)"
          srcset="assets/homepage-background-mobile.webp"
        />
        <img
          class="hero__background"
          src="assets/homepage-background-desktop-v4-clean.webp"
          alt="A colorful paper-cut illustration of the San Francisco skyline beneath a bright blue sky."
        />
      </picture>
      <div class="hero__ambient" aria-hidden="true">
        <img class="hero__gull hero__gull--1" src="assets/ambient/gull-1.webp" alt="" />
        <img class="hero__gull hero__gull--2" src="assets/ambient/gull-2.webp" alt="" />
        <img class="hero__gull hero__gull--3" src="assets/ambient/gull-3.webp" alt="" />
        <img class="hero__gull hero__gull--4" src="assets/ambient/gull-4.webp" alt="" />
        <img class="hero__gull hero__gull--5" src="assets/ambient/gull-5.webp" alt="" />
        <img class="hero__gull hero__gull--6" src="assets/ambient/gull-6.webp" alt="" />
        <img
          class="hero__flagpole"
          src="assets/ambient/ferry-flagpole.webp"
          alt=""
        />
        <img
          class="hero__flag"
          src="assets/ambient/ferry-flag.webp"
          alt=""
        />
      </div>
      <div class="hero__bay" aria-hidden="true">
        <div class="hero__boat-entry">
          <div class="hero__boat-cruise">
            <img
              class="hero__boat"
              src="assets/sailboat-red-sloop.webp"
              alt=""
            />
          </div>
        </div>
      </div>
      <img
        class="hero__foreground"
        src="assets/homepage-foreground-bushes.webp"
        alt=""
        aria-hidden="true"
      />
      <div class="hero__title-stage" aria-hidden="true">
        <img
          class="hero__title"
          src="assets/homepage-title-clouds-layer.webp"
          alt=""
        />
      </div>
      <div class="sr-only">
        <h1>Emily Parsons</h1>
      </div>
      <div class="hero__fog-engulf" aria-hidden="true">
        <img
          class="hero__fog-engulf-art"
          src="assets/fog-engulf-v2-clean-tall.png"
          alt=""
        />
      </div>
      <div class="hero__fog-pieces" aria-hidden="true">
        <img class="hero__fog-piece hero__fog-piece--1" src="assets/fog-pieces/fog-piece-1-tall.png" alt="" />
        <img class="hero__fog-piece hero__fog-piece--2" src="assets/fog-pieces/fog-piece-1-tall.png" alt="" />
        <img class="hero__fog-piece hero__fog-piece--3" src="assets/fog-pieces/fog-piece-1-tall.png" alt="" />
        <img class="hero__fog-piece hero__fog-piece--4" src="assets/fog-pieces/fog-piece-1-tall.png" alt="" />
      </div>
      </main>
    </div>

    <section class="about" aria-labelledby="about-title">
      <div class="about__inner">
        <h2 id="about-title" class="sr-only">Emily Parsons interactive typography</h2>
        <iframe
          class="about__embed"
          src="assets/trailing-text.html?v=20260822-1"
          title="Interactive trailing text experiment"
          loading="lazy"
          sandbox="allow-scripts allow-same-origin"
        ></iframe>
        <form class="about__search" aria-label="Ask Emily" novalidate>
          <label class="sr-only" for="about-query">Ask Emily a question</label>
          <input
            id="about-query"
            name="query"
            type="text"
            autocomplete="off"
            spellcheck="true"
            placeholder=""
          />
          <button type="submit" aria-label="Ask" hidden>
            <span aria-hidden="true">→</span>
          </button>
        </form>
      </div>
    </section>

    <script src="script.js?v=20260822-8"></script>
  </body>
</html>
