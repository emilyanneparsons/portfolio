<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The personal portfolio of Emily Parsons."
    />
    <title>Emily Parsons</title>
    <link rel="stylesheet" href="styles.css" />

  <body>
